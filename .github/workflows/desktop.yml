name: Stumix Desktop (Windows)

on:
  push:
    branches: [desktop, main]
    paths: ['desktop/**', 'index.html', 'lame.min.js', 'icons/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: SDK do WebView2
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.2903.40 -Source nugetRepository -Force | Out-Null

      - name: SDK do ASIO (GPLv3)
        run: git clone --depth 1 https://codeberg.org/rubiefawn/asiosdk asiosdk

      - name: Configurar
        run: cmake -S desktop -B build -A x64 -DASIO_SDK_DIR="${{ github.workspace }}/asiosdk"

      - name: Compilar
        run: cmake --build build --config Release --target EstudioDesktop EngineTest StumixTesteGanho_VST3 --parallel

      - name: Teste do motor
        run: build\EngineTest_artefacts\Release\EngineTest.exe build\StumixTesteGanho_artefacts\Release\VST3\StumixTesteGanho.vst3

      - name: Teste de ponta a ponta (interface + motor, placa simulada)
        shell: pwsh
        run: |
          $exe = "build\EstudioDesktop_artefacts\Release\Stumix.exe"
          $p = Start-Process $exe -ArgumentList "--autoteste=$pwd\desktop\autoteste.js" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "tempo esgotado" }
          Get-Content autoteste.log -Encoding utf8
          if (-not (Select-String -Path autoteste.log -Pattern "TODOS OS TESTES PASSARAM" -Quiet)) { exit 1 }

      - name: Instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $v = ([regex]::Match((Get-Content desktop\CMakeLists.txt -Raw), 'VERSION (\d+\.\d+\.\d+)')).Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersao="$v" /DFonte="$pwd\build\EstudioDesktop_artefacts\Release" /O"$pwd\saida" desktop\instalador\estudio.iss
          Compress-Archive -Path build\EstudioDesktop_artefacts\Release\Stumix.exe -DestinationPath saida\Stumix-portatil.zip

      - name: Teste da atualização pelo botão (troca o próprio .exe, sem instalador)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) instala esta versão, como a pessoa faz na primeira vez
          $i = Start-Process "saida\Stumix-Desktop-Instalador.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru
          $i.WaitForExit(120000) | Out-Null
          Start-Sleep 3; Get-Process Stumix -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 1
          $alvo = Join-Path $env:LOCALAPPDATA "Programs\Stumix\Stumix.exe"
          if (-not (Test-Path $alvo)) { Write-Host "instalação inicial falhou"; exit 1 }
          # 2) pacote publicado e o .exe que ele traz
          $url = gh api repos/${{ github.repository }}/releases/latest --jq '.assets[] | select(.name | endswith("portatil.zip")) | .browser_download_url'
          Write-Host "pacote: $url"
          Invoke-WebRequest $url -OutFile pacote.zip; Expand-Archive pacote.zip -DestinationPath pacote -Force
          $esperado = (Get-FileHash pacote\Stumix.exe).Hash
          # 3) o app instalado se atualiza sozinho, como no botão
          $p = Start-Process $alvo -ArgumentList "--testar-atualizacao=$url" -WorkingDirectory $pwd -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "tempo esgotado"; exit 1 }
          Get-Content atualizacao.log -Encoding utf8
          if (-not (Select-String -Path atualizacao.log -Pattern '"ok": true' -Quiet)) { exit 1 }
          Start-Sleep 8
          $agora = (Get-FileHash $alvo).Hash
          $rodando = @(Get-Process Stumix -ErrorAction SilentlyContinue).Count
          Get-Process Stumix -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "exe trocado: $($agora -eq $esperado) | versão nova aberta: $($rodando -gt 0)"
          if ($agora -ne $esperado -or $rodando -lt 1) { exit 1 }

      - name: Pacote da Microsoft Store (MSIX) e teste instalando
        shell: pwsh
        env:
          # identidade do Partner Center (Configurações do repositório → Variables); sem elas, sai um pacote de teste
          LOJA_NOME: ${{ vars.LOJA_NOME }}
          LOJA_PUBLISHER: ${{ vars.LOJA_PUBLISHER }}
          LOJA_PUBLISHER_NOME: ${{ vars.LOJA_PUBLISHER_NOME }}
        run: |
          $v = ([regex]::Match((Get-Content desktop\CMakeLists.txt -Raw), 'VERSION (\d+\.\d+\.\d+)')).Groups[1].Value + '.0'
          $nome = if ($env:LOJA_NOME) { $env:LOJA_NOME } else { 'StumixTeste.Stumix' }
          $pub  = if ($env:LOJA_PUBLISHER) { $env:LOJA_PUBLISHER } else { 'CN=StumixTeste' }
          $pubN = if ($env:LOJA_PUBLISHER_NOME) { $env:LOJA_PUBLISHER_NOME } else { 'Stumix (teste)' }
          Write-Host "pacote $nome $v | $pub | $pubN"
          $kit = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          New-Item msix, loja -ItemType Directory -Force | Out-Null
          Copy-Item build\EstudioDesktop_artefacts\Release\Stumix.exe msix\
          Copy-Item desktop\msix\Assets msix\Assets -Recurse
          (Get-Content desktop\msix\AppxManifest.xml -Raw).Replace('$NOME$', $nome).Replace('$PUBLISHER$', $pub).Replace('$PUBLISHER_NOME$', $pubN).Replace('$VERSAO$', $v) | Set-Content msix\AppxManifest.xml -Encoding utf8
          & "$kit\makepri.exe" createconfig /cf priconfig.xml /dq pt-BR /o | Out-Null
          & "$kit\makepri.exe" new /pr msix /cf priconfig.xml /of msix\resources.pri /o | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "makepri falhou"; exit 1 }
          & "$kit\makeappx.exe" pack /d msix /p loja\Stumix-Loja.msix /o
          if ($LASTEXITCODE -ne 0) { Write-Host "makeappx falhou"; exit 1 }
          # teste: assina uma cópia com certificado de teste, instala como a Store instalaria e abre
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature -FriendlyName "Stumix teste" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Copy-Item loja\Stumix-Loja.msix teste.msix
          & "$kit\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint teste.msix
          Export-Certificate -Cert $cert -FilePath teste.cer | Out-Null
          Import-Certificate -FilePath teste.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage teste.msix
          $pkg = Get-AppxPackage -Name $nome
          if (-not $pkg) { Write-Host "pacote não instalou"; exit 1 }
          Get-Process Stumix -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!Stumix"
          Start-Sleep 15
          $rodando = @(Get-Process Stumix -ErrorAction SilentlyContinue)
          $caminho = if ($rodando.Count) { $rodando[0].Path } else { '' }
          Write-Host "aberto pela Store: $($rodando.Count -gt 0) | $caminho"
          $rodando | Stop-Process -Force
          Remove-AppxPackage $pkg.PackageFullName
          if ($rodando.Count -lt 1 -or $caminho -notlike '*WindowsApps*') { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Stumix-Loja-MSIX
          path: loja/Stumix-Loja.msix

      - uses: actions/upload-artifact@v4
        with:
          name: Stumix-Desktop-Windows
          path: saida/*

      - name: Versão nova?
        id: versao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([regex]::Match((Get-Content desktop\CMakeLists.txt -Raw), 'VERSION (\d+\.\d+\.\d+)')).Groups[1].Value
          "tag=desktop-v$v" >> $env:GITHUB_OUTPUT
          # só conta como publicada se não for rascunho (um envio que falhou no meio deixa rascunho)
          $rascunho = gh release view "desktop-v$v" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $rascunho -eq 'false') { "nova=false" >> $env:GITHUB_OUTPUT } else { "nova=true" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Publicar versão (o botão de atualização do app encontra aqui)
        if: steps.versao.outputs.nova == 'true' && github.ref == 'refs/heads/desktop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Stumix Desktop ${{ steps.versao.outputs.tag }}
          files: saida/*
