name: Stumix Desktop (Windows)

on:
  push:
    branches: [desktop, main]
    paths: ['desktop/**', 'index.html', 'lame.min.js', 'icons/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: SDK do WebView2
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.2903.40 -Source nugetRepository -Force | Out-Null

      - name: SDK do ASIO (GPLv3)
        run: git clone --depth 1 https://codeberg.org/rubiefawn/asiosdk asiosdk

      - name: Configurar
        run: cmake -S desktop -B build -A x64 -DASIO_SDK_DIR="${{ github.workspace }}/asiosdk"

      - name: Compilar
        run: cmake --build build --config Release --target EstudioDesktop EngineTest --parallel

      - name: Teste do motor
        run: build\EngineTest_artefacts\Release\EngineTest.exe

      - name: Teste de ponta a ponta (interface + motor, placa simulada)
        shell: pwsh
        run: |
          $exe = "build\EstudioDesktop_artefacts\Release\Stumix.exe"
          $p = Start-Process $exe -ArgumentList "--autoteste=$pwd\desktop\autoteste.js" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "tempo esgotado" }
          Get-Content autoteste.log -Encoding utf8
          if (-not (Select-String -Path autoteste.log -Pattern "TODOS OS TESTES PASSARAM" -Quiet)) { exit 1 }

      - name: Teste da atualização (baixa e roda o instalador publicado, como o botão faz)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = gh api repos/${{ github.repository }}/releases/latest --jq '.assets[] | select(.name | endswith("Instalador.exe")) | .browser_download_url'
          Write-Host "instalador: $url"
          $p = Start-Process "build\EstudioDesktop_artefacts\Release\Stumix.exe" -ArgumentList "--testar-atualizacao=$url" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "tempo esgotado"; exit 1 }
          Get-Content atualizacao.log -Encoding utf8
          if (-not (Select-String -Path atualizacao.log -Pattern '"ok": true' -Quiet)) { exit 1 }
          $alvo = Join-Path $env:LOCALAPPDATA "Programs\Stumix\Stumix.exe"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $alvo); $i++) { Start-Sleep 2 }
          Get-Process Stumix -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $alvo)) { Write-Host "o instalador não deixou o app em $alvo"; exit 1 }
          Write-Host "instalado em $alvo"

      - name: Instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $v = ([regex]::Match((Get-Content desktop\CMakeLists.txt -Raw), 'VERSION (\d+\.\d+\.\d+)')).Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersao="$v" /DFonte="$pwd\build\EstudioDesktop_artefacts\Release" /O"$pwd\saida" desktop\instalador\estudio.iss
          Compress-Archive -Path build\EstudioDesktop_artefacts\Release\Stumix.exe -DestinationPath saida\Stumix-portatil.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Stumix-Desktop-Windows
          path: saida/*

      - name: Versão nova?
        id: versao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([regex]::Match((Get-Content desktop\CMakeLists.txt -Raw), 'VERSION (\d+\.\d+\.\d+)')).Groups[1].Value
          "tag=desktop-v$v" >> $env:GITHUB_OUTPUT
          gh release view "desktop-v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "nova=false" >> $env:GITHUB_OUTPUT } else { "nova=true" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Publicar versão (o botão de atualização do app encontra aqui)
        if: steps.versao.outputs.nova == 'true' && github.ref == 'refs/heads/desktop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Stumix Desktop ${{ steps.versao.outputs.tag }}
          files: saida/*
